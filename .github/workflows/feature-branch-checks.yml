name: Feature Branch Checks

on:
  pull_request:
    branches: [ "dev/test-site", "develop" ]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r bridge_club_management/requirements/base.txt
        pip install -r bridge_club_management/requirements/local.txt
    
    - name: Set up environment
      run: |
        echo "DJANGO_SETTINGS_MODULE=bridge_club_management.settings.local" >> $GITHUB_ENV
        echo "DJANGO_SECRET_KEY=test-secret-key-for-pr" >> $GITHUB_ENV
    
    - name: Run tests
      run: |
        cd bridge_club_management
        python manage.py test --verbosity=2
    
    - name: Check for missing migrations
      run: |
        cd bridge_club_management
        python manage.py makemigrations --check --dry-run
    
    - name: Django system checks
      run: |
        cd bridge_club_management
        python manage.py check
    
    - name: PR Summary
      run: |
        echo "✅ All checks passed for this PR"
        echo "Safe to merge into target branch"