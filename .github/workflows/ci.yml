name: CI

on:
  push:
    branches:
      - main
      - dev/test-site
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev/test-site
      - 'feature/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (for mysqlclient if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev

      - name: Install Python dependencies
        working-directory: Bridgehjemmeside/bridge_club_management
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          # Optional local/dev extras if present (ignored if missing)
          if [ -f requirements/local.txt ]; then pip install -r requirements/local.txt || true; fi

      - name: Run tests
        working-directory: Bridgehjemmeside/bridge_club_management
        env:
          DJANGO_SETTINGS_MODULE: bridge_club_management.settings.local
        run: |
          python run_tests.py 0 