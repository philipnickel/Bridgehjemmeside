name: Django CI

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main", "dev", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements/base.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r bridge_club_management/requirements/base.txt
        pip install -r bridge_club_management/requirements/local.txt
    
    - name: Set up environment variables
      run: |
        echo "DJANGO_SETTINGS_MODULE=bridge_club_management.settings.local" >> $GITHUB_ENV
        echo "DJANGO_SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "DEBUG=True" >> $GITHUB_ENV
    
    - name: Run Django migrations
      run: |
        cd bridge_club_management
        python manage.py migrate
    
    - name: Run Django tests
      run: |
        cd bridge_club_management
        python manage.py test --verbosity=2
    
    - name: Run Django system checks
      run: |
        cd bridge_club_management
        python manage.py check
    
    - name: Check for missing migrations
      run: |
        cd bridge_club_management
        python manage.py makemigrations --check --dry-run
    
    - name: Collect static files
      run: |
        cd bridge_club_management
        python manage.py collectstatic --noinput
    
    - name: Upload coverage reports to Codecov (optional)
      if: matrix.python-version == '3.11'
      run: |
        # Uncomment below if you want to add coverage reporting
        # pip install coverage
        # cd bridge_club_management
        # coverage run --source='.' manage.py test
        # coverage xml
        # bash <(curl -s https://codecov.io/bash)
        echo "Coverage reporting not configured yet" 