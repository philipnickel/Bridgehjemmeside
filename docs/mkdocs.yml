site_name: Bridge Club Management System
site_description: Django-based web application for managing bridge club activities, substitute lists, and member coordination
site_url: https://philipnickel.github.io/Bridgehjemmeside
repo_url: https://github.com/philipnickel/Bridgehjemmeside
repo_name: philipnickel/Bridgehjemmeside

docs_dir: content

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - User Guide: 
    - Development Workflow: ../DEVELOPMENT.md
    - Environment Setup: ENVIRONMENTS.md
    - Commands Reference: COMMANDS.md
    - Deployment Guide: DEPLOYMENT.md
    - Troubleshooting: TROUBLESHOOTING.md
  - Architecture:
    - Project Structure: ARCHITECTURE.md
    - Danish User Guide: BRUGERVEJLEDNING.md
  - API Reference:
    - Models: api/models.md
    - Views: api/views.md
    - Forms: api/forms.md
    - Admin: api/admin.md
    - Management Commands: api/management.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../bridge_club_management]
          options:
            docstring_style: google
            docstring_section_style: table
            heading_level: 2
            members_order: source
            show_root_heading: true
            show_source: true
            show_bases: true
            show_inheritance_diagram: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/philipnickel/Bridgehjemmeside
  version:
    provider: mike